[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.36"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
ffi = false
fs_permissions = [{ access = "read", path = "./" }]

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/=lib/openzeppelin-contracts/",
  "forge-std/=lib/forge-std/src/",
  "vault-v2/=lib/vault-v2/src/",
  "halmos-cheatcodes/=lib/halmos-cheatcodes/src/",
  "@erc6900/reference-implementation/=lib/reference-implementation-v080/src/",
  "@eth-infinitism/account-abstraction/=lib/account-abstraction/contracts/",
  "@account-abstraction/contracts/=lib/account-abstraction/contracts/",
  "account-abstraction/=lib/account-abstraction/contracts/",
  "@alchemy/modular-account/=lib/modular-account-v2/src/",
  "solady/=lib/solady-v00237/src/",
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 256
depth = 32
fail_on_revert = false

[rpc_endpoints]
base = "${BASE_RPC_URL}"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
